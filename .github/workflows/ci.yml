name: CI

# Ported from .gitlab-ci.yml as part of the menger → GitHub consolidation (Phase B,
# WORKSPACE_STRATEGY.md step 5). GitHub is the source of truth; GitLab is a passive backup.
#
# ── HOST PREREQUISITES (self-hosted NVIDIA runner registered to lene/menger) ──
# The GPU jobs run directly on the host (no Docker image, matching optix-jni's ci.yml), so
# the runner host must provide what the old optix-cuda image did:
#   • CUDA 13.x toolkit at /usr/local/cuda  • OptiX SDK 9.0 (OPTIX_ROOT)
#   • JDK 21+ and sbt on PATH
#   • Headless GL + video for LibGDX/VideoLoader tests: xvfb, mesa-utils, x11-xserver-utils,
#     libavcodec/format/util/swscale-dev, imagemagick, unzip, bc, time
#   • nvidia driver with the RTX core lib (libnvidia-rtcore.so.1) resolvable — see
#     docs/TROUBLESHOOTING.md. Persistent host setup, not per-run apt-get (no sudo in CI).
#
# ── SECRETS ──  SONAR_TOKEN (sonar job), GITHUB token is automatic.
# ── DROPPED vs GitLab (intentional) ──
#   • PushToGithub / mirror — reversed: GitHub is origin now; mirror-to-gitlab.yml backs up GitLab.
#   • Upload (GitLab package registry), code_quality (GitLab CodeClimate template),
#     RunnerHeartbeat, StandardsDrift (workspace check-drift.yml covers cross-repo drift),
#     Renovate (use the GitHub Renovate app / Dependabot instead).
#   • AIReview: retired 2026-08-07 (Sprint 36 A2) — no funded API key, ambiguous-green
#     failure mode masked by continue-on-error. See docs/QA_INCIDENTS.md.

on:
  pull_request:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  schedule:
    - cron: '0 4 * * 1'   # weekly PerfCheck baseline (was GitLab scheduled pipeline)
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Single source of the version (was .gitlab-ci.yml DEPLOYABLE_VERSION). The
  # /release-checklist skill + pre-push 4-file consistency check must be repointed here.
  DEPLOYABLE_VERSION: "0.8.12"
  DEPLOYABLE_BASE_NAME: menger
  SCALA_VERSION: "3.8.3"
  __GL_THREADED_OPTIMIZATIONS: "0"   # SIGBUS workaround in libnvidia-glcore glfwDestroyWindow

jobs:
  # ── preconditions (cheap, ubuntu) ──────────────────────────────────────────
  # (standards parity is enforced at the workspace-repo level; the per-repo
  #  check-standards-drift.sh was removed — see menger commit e901c90.)
  version-consistent:
    name: Version + Scala Consistent
    runs-on: ubuntu-latest
    # A hotfix/#norelease branch may intentionally not bump — skip on those PRs.
    if: >-
      github.event_name != 'pull_request' ||
      ( !startsWith(github.head_ref, 'hotfix/') &&
        !contains(github.event.pull_request.title, '#norelease') &&
        !contains(join(github.event.pull_request.labels.*.name), 'NORELEASE') )
    steps:
      - uses: actions/checkout@v4
      - name: build.sbt version/scala match the workflow env + USER_GUIDE; not yet released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v_sbt=$(grep -E 'version := ".*"' menger-app/build.sbt | head -1 | cut -d'"' -f2)
          v_guide=$(grep -E '^\*\*Version\*\*:' docs/USER_GUIDE.md | cut -d' ' -f2)
          s_sbt=$(grep -E 'scalaVersion := ".*"' menger-app/build.sbt | head -1 | cut -d'"' -f2)
          echo "build.sbt version=$v_sbt guide=$v_guide  workflow=$DEPLOYABLE_VERSION"
          echo "build.sbt scala=$s_sbt  workflow=$SCALA_VERSION"
          [ "$v_sbt" = "$DEPLOYABLE_VERSION" ] || { echo "::error::version mismatch build.sbt vs ci.yml"; exit 1; }
          [ "$v_sbt" = "$v_guide" ]           || { echo "::error::version mismatch build.sbt vs USER_GUIDE"; exit 1; }
          [ "$s_sbt" = "$SCALA_VERSION" ]      || { echo "::error::scalaVersion mismatch build.sbt vs ci.yml"; exit 1; }
          # A published Release (not a mere tag) is the "already shipped" signal: the tag is
          # created by create-tag on merge, and a release can be pending after a tag exists.
          if gh release view "$v_sbt" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $v_sbt already published — bump version"; exit 1; fi

  changelog-updated:
    name: Changelog Updated
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      !startsWith(github.head_ref, 'hotfix/') &&
      !contains(github.event.pull_request.title, '#norelease') &&
      !contains(join(github.event.pull_request.labels.*.name), 'NORELEASE')
    steps:
      - uses: actions/checkout@v4
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          v=$(grep -E 'version := ".*"' menger-app/build.sbt | head -1 | cut -d'"' -f2)
          grep -qF "## [$v]" CHANGELOG.md || { echo "::error::CHANGELOG missing '## [$v]'"; exit 1; }
          grep -qF "...$v" CHANGELOG.md   || { echo "::error::CHANGELOG missing compare link '...$v'"; exit 1; }
          if echo "$PR_TITLE" | grep -qE '^(Draft|WIP):'; then
            echo "draft PR — skipping dated-entry check"
          else
            grep -qF "## [$v] - $(TZ=UTC date +%Y-%m-%d)" CHANGELOG.md \
              || { echo "::error::CHANGELOG '## [$v]' needs today's date"; exit 1; }
          fi

  policy:
    name: Policy (test-justification, rendering-discipline, log-verbosity, issue-link)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute QA_RANGES and run policy suite
        run: |
          set -euo pipefail
          . ./standards/hooks/lib.sh
          RANGES=$(push_ranges < /dev/null)
          export QA_RANGES="$RANGES"
          ./scripts/suites/policy.sh

  # ── quality + tests (need CUDA to compile menger-geometry native → nvidia host) ──
  scalafix:
    name: Scalafix
    runs-on: [self-hosted, Linux, X64, nvidia]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Add CUDA to PATH
        run: echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"
      - run: ./scripts/suites/lint.sh
        env:
          HAS_SCALA: "1"

  test-full:
    name: Test (full suite, GPU)
    runs-on: [self-hosted, Linux, X64, nvidia]
    timeout-minutes: 30
    env:
      HAS_SCALA: "1"
      HAS_NATIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Add CUDA to PATH
        run: echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"
      - name: nvidia-smi (fail fast if GPU absent)
        run: nvidia-smi
      - name: Run full test suite (scripts/suites/unit.sh)
        run: ./scripts/suites/unit.sh
      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@db71d41eb79864e25ab0337e395c352e84523afe # v4
        with:
          report_paths: 'menger-app/target/test-reports/**/TEST-*.xml'

  integration:
    name: OptiX Integration (packaged app, GPU)
    runs-on: [self-hosted, Linux, X64, nvidia]
    timeout-minutes: 30
    env:
      HAS_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Add CUDA to PATH
        run: echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"
      - run: nvidia-smi
      - name: Package (scripts/suites/package.sh)
        run: ./scripts/suites/package.sh
      - name: Run integration suite (scripts/suites/integration.sh)
        run: |
          export LD_LIBRARY_PATH=/usr/local/cuda/lib64
          ./scripts/suites/integration.sh
      - name: Upload diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-diffs
          path: scripts/test-diffs/
          if-no-files-found: ignore

  native-checks:
    name: Native static analysis (cppcheck + clang-tidy, GPU)
    # New job (Sprint 36 B4): these gates previously ran only in the local pre-push
    # hook — a push from a machine without cppcheck/clang-tidy installed, or with
    # --no-verify, shipped native changes with zero CI-side safety net for them. See
    # the Sprint 36 Phase B plan and docs/QA_INCIDENTS.md.
    runs-on: [self-hosted, Linux, X64, nvidia]
    timeout-minutes: 20
    env:
      HAS_NATIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Add CUDA to PATH
        run: echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"
      - name: Build native (for clang-tidy's compile_commands.json)
        run: sbt "project mengerGeometry" compile
      - run: ./scripts/suites/native-checks.sh

  memcheck:
    name: Memory safety (Valgrind + compute-sanitizer, GPU)
    # New job (Sprint 36 B4): same gap as native-checks above — memcheck existed only
    # locally before this.
    runs-on: [self-hosted, Linux, X64, nvidia]
    timeout-minutes: 30
    env:
      HAS_NATIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Add CUDA to PATH
        run: echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"
      - run: ./scripts/suites/memcheck.sh

  coverage:
    name: Coverage ratchet (GPU)
    # Converted to call scripts/suites/coverage.sh (Sprint 36 B4/O3) — was duplicate
    # inline scoverage logic with its own GitHub Actions-cache baseline
    # (coverage-prev.log, statement+branch rate) that had drifted from what the local
    # pre-push hook actually checks (.coverage_baseline, statement rate only). O3's goal
    # is one suite definition shared by hook and CI; branch-rate tracking was CI-only
    # and is dropped here to match, not preserved as a second, hook-inconsistent gate.
    runs-on: [self-hosted, Linux, X64, nvidia]
    timeout-minutes: 30
    env:
      HAS_SCALA: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Add CUDA to PATH
        run: echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"
      - name: Run coverage + ratchet check (scripts/suites/coverage.sh)
        run: ./scripts/suites/coverage.sh
      - name: Upload scoverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoverage-report
          path: menger-app/target/scala-${{ env.SCALA_VERSION }}/scoverage-report/
          if-no-files-found: ignore

  run-smoke:
    name: Run smoke (sponge types + animation, GPU)
    runs-on: [self-hosted, Linux, X64, nvidia]
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || true
    env:
      HAS_RENDERING: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Add CUDA to PATH
        run: echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"
      - run: nvidia-smi
      - name: Smoke-run each sponge type + a DSL animation (scripts/suites/smoke.sh)
        run: ./scripts/suites/smoke.sh

  runtime:
    name: Runtime budget (GPU)
    runs-on: [self-hosted, Linux, X64, nvidia]
    timeout-minutes: 20
    env:
      TEST_RUN_MAX_RUNNING_TIME: "60"   # seconds; was a GitLab CI variable
    steps:
      - uses: actions/checkout@v4
      - name: Add CUDA to PATH
        run: echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"
      - run: nvidia-smi
      - name: Measure a level-1 render runtime against the budget
        run: |
          set -euo pipefail
          sbt compile
          unset OPTIX_ROOT || true
          /usr/bin/time -f %U -o runtime.log xvfb-run -a sbt "mengerApp / run --objects type=sponge-volume:level=1 --timeout 0.1"
          echo "user-time=$(cat runtime.log)  budget=${TEST_RUN_MAX_RUNNING_TIME}s"
          [ "$(echo "$(cat runtime.log) > $TEST_RUN_MAX_RUNNING_TIME" | bc -l)" -eq 0 ]

  # SonarCloud analysis is handled by the SonarCloud GitHub App (automatic on PRs/pushes),
  # so there is no sonar job here — it would double-run. Config lives in sonar-project.properties.
  # sonar-ratchet below only blocks on and ratchets against that app's posted check.

  sonar-ratchet:
    name: Sonar ratchet (F2)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-sonar-ratchet.sh "${{ github.event.pull_request.head.sha }}"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── build + release ─────────────────────────────────────────────────────────
  build-deployable:
    name: Build deployable zip (GPU)
    runs-on: [self-hosted, Linux, X64, nvidia]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Add CUDA to PATH
        run: echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"
      - name: Package
        run: |
          set -euo pipefail
          sbt "mengerApp / Universal / packageBin"
          mv "menger-app/target/universal/${DEPLOYABLE_BASE_NAME}-app-${DEPLOYABLE_VERSION}.zip" \
             "./${DEPLOYABLE_BASE_NAME}-${DEPLOYABLE_VERSION}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: menger-deployable
          path: ${{ env.DEPLOYABLE_BASE_NAME }}-${{ env.DEPLOYABLE_VERSION }}.zip

  perf-check:
    name: PerfCheck (benchmark vs baseline, GPU)
    runs-on: [self-hosted, Linux, X64, nvidia]
    timeout-minutes: 25
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    needs: [build-deployable]
    steps:
      - uses: actions/checkout@v4
      - name: Add CUDA to PATH
        run: echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: menger-deployable
      - name: Run benchmark
        run: |
          set -euo pipefail
          unzip -oq "menger-${DEPLOYABLE_VERSION}.zip"
          export LD_LIBRARY_PATH=/usr/local/cuda/lib64
          ./scripts/benchmark.sh "./menger-app-${DEPLOYABLE_VERSION}/bin/menger-app"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: perf-results.json
          if-no-files-found: ignore

  # Tag the release version on a push to main once the gates are green (mirrors optix-jni).
  create-tag:
    name: Create release tag
    runs-on: ubuntu-latest
    # workflow_dispatch is a manual escape hatch: a merge to main occasionally lands
    # without Actions delivering a push event (0.8.11 sat untagged for a day that way),
    # and without this the only recovery is inventing a dummy commit.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # Repo default GITHUB_TOKEN is read-only; pushing the tag needs write.
    permissions:
      contents: write
    needs: [test-full, integration, run-smoke, runtime, build-deployable, scalafix, native-checks, memcheck]
    outputs:
      need_release: ${{ steps.tag.outputs.need_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag
        name: Tag DEPLOYABLE_VERSION and decide whether a release is needed
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PREV: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          . ./standards/hooks/lib.sh
          # Skip tagging + release when any commit in the push range carries
          # NORELEASE or [skip release] in its message. Push events have no
          # PR-label context, so the marker must live in the commit message
          # (it survives both squash and merge commits when placed in the PR title).
          # before/after exist only on push payloads — on workflow_dispatch they are
          # empty, so scan the tip commit alone rather than building a broken range.
          if [ "$EVENT_NAME" != "push" ]; then
            RANGE="HEAD~1..HEAD"
          elif [ "$PREV" = "0000000000000000000000000000000000000000" ]; then
            RANGE="$HEAD_SHA"
          else
            RANGE="$PREV..$HEAD_SHA"
          fi
          if git log --format=%B "$RANGE" | grep -qiE 'NORELEASE|\[skip release\]'; then
            echo "::notice::Release skipped — NORELEASE/[skip release] marker in commit message."
            echo "need_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git tag | grep -qx "$DEPLOYABLE_VERSION"; then
            echo "tag $DEPLOYABLE_VERSION already exists - not re-tagging"
          else
            git tag "$DEPLOYABLE_VERSION"
            retry_with_backoff "git push tag" git push origin "$DEPLOYABLE_VERSION"
          fi
          # A tag pushed by GITHUB_TOKEN does NOT trigger a second workflow, so the
          # release job runs in this same run instead of on the tag. Publish only when
          # the GitHub Release is still missing - idempotent and self-recovering.
          if gh release view "$DEPLOYABLE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "need_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "need_release=true" >> "$GITHUB_OUTPUT"
          fi

  # Runs in the SAME push-to-main run (a GITHUB_TOKEN tag push cannot trigger a tag
  # workflow). install-smoke the packaged app, then publish the GitHub Release.
  release:
    name: Install-smoke + GitHub Release
    runs-on: [self-hosted, Linux, X64, nvidia]
    timeout-minutes: 15
    # Publishing the GitHub Release needs write; repo default token is read-only.
    permissions:
      contents: write
    needs: [create-tag]
    if: needs.create-tag.outputs.need_release == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Add CUDA to PATH
        run: echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"
      - name: Build + install-smoke render
        run: |
          set -euo pipefail
          sbt "mengerApp / Universal / packageBin"
          mv "menger-app/target/universal/${DEPLOYABLE_BASE_NAME}-app-${DEPLOYABLE_VERSION}.zip" \
             "./${DEPLOYABLE_BASE_NAME}-${DEPLOYABLE_VERSION}.zip"
          unzip -oq "menger-${DEPLOYABLE_VERSION}.zip"
          export LD_LIBRARY_PATH=/usr/local/cuda/lib64
          xvfb-run -a "./menger-app-${DEPLOYABLE_VERSION}/bin/menger-app" --objects type=cube-sponge:level=1 --timeout 0.1
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: ${{ env.DEPLOYABLE_VERSION }}
          name: ${{ env.DEPLOYABLE_VERSION }}
          body: "Full changelog: https://github.com/lene/menger/blob/${{ env.DEPLOYABLE_VERSION }}/CHANGELOG.md"
          files: ${{ env.DEPLOYABLE_BASE_NAME }}-${{ env.DEPLOYABLE_VERSION }}.zip
